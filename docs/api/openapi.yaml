openapi: 3.0.3
info:
  title: Movank API
  version: 0.4.0
  description: Identidad, productos y ventas por comercio. Pagos pendientes.
servers:
  - url: http://localhost:8080
paths:
  /v1/products:
    post:
      operationId: createProduct
      summary: Crea un producto del comercio autenticado
      description: SKU normalizado y único por comercio. No admite merchant_id ni parámetros de query. Cuerpo máximo de 8192 bytes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Producto creado
          headers:
            Location:
              schema:
                type: string
              description: Ruta del producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SKUConflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listProducts
      summary: Lista productos del comercio autenticado
      description: Ordenados por UUID ascendente. Rechaza parámetros desconocidos o repetidos. La paginación no es una instantánea ante altas concurrentes.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: after
          description: UUID indicado por next_cursor en la página anterior
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página del catálogo; next_cursor es null al terminar
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  next_cursor:
                    type: string
                    format: uuid
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/products/{id}:
    get:
      operationId: getProduct
      summary: Consulta un producto del comercio autenticado
      description: Devuelve el mismo 404 si no existe o pertenece a otro comercio. No admite query.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me:
    get:
      operationId: currentIdentity
      summary: Consulta la identidad y el comercio del token verificado
      description: El comercio se obtiene de merchant_id en el JWT, nunca del cuerpo, query ni encabezados personalizados.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identidad autenticada y comercio existente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, merchant]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  merchant:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
        '401':
          description: Token ausente, inválido o vencido
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: El comercio del token ya no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '503':
          description: No se pudo consultar el comercio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
  /healthz:
    get:
      operationId: health
      summary: Comprueba que el proceso HTTP responde
      responses:
        '200':
          description: Proceso activo, independientemente de PostgreSQL y Redis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthy'
  /readyz:
    get:
      operationId: readiness
      summary: Comprueba conectividad con PostgreSQL con un plazo de un segundo
      description: No verifica migraciones ni Redis. La respuesta no incluye detalles de conexión.
      responses:
        '200':
          description: PostgreSQL responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthy'
        '503':
          description: PostgreSQL no responde o se agotó el plazo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [unavailable]
  /v1/sales:
    post:
      summary: Crear una venta con idempotencia persistente
      description: >-
        Precios calculados desde el catálogo del comercio autenticado. Máximo 100
        productos distintos y 16384 bytes de JSON. El orden de los productos y
        las mayúsculas de UUID no cambian el pedido. Misma clave y pedido devuelve
        la venta original con 201; distinto pedido devuelve 409. Los errores de
        validación no reservan la clave. Ante timeout o 503, reintentar con la misma clave y pedido.
        No procesa pagos. No se permite merchant_id ni precios en el cuerpo.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Clave estable por operación y comercio; sin caducidad.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleInput'
      responses:
        '201':
          description: Venta creada o repetición de la venta original
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Clave ya utilizada con otro pedido (idempotency_conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductError'
        '413':
          description: Cuerpo mayor a 16384 bytes (body_too_large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sales/{id}:
    get:
      summary: Consultar una venta del comercio autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Venta con sus precios originales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  responses:
    BadRequest:
      description: JSON, campos o parámetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
    Unauthorized:
      description: Token ausente, inválido o vencido
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
    Forbidden:
      description: El comercio autenticado ya no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
    NotFound:
      description: Recurso no encontrado en el comercio autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
    SKUConflict:
      description: El SKU normalizado ya existe en este comercio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
    BodyTooLarge:
      description: Cuerpo mayor a 8192 bytes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
    UnsupportedMediaType:
      description: Se requiere Content-Type application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
    Unavailable:
      description: No se pudo completar la operación en PostgreSQL
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 con iss=movank-local, aud=movank-api, exp, iat, nbf, sub (UUID) y merchant_id (UUID).
  schemas:
    SaleInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Cada producto debe aparecer una sola vez y pertenecer al comercio.
          items:
            type: object
            additionalProperties: false
            required: [product_id, quantity]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
    Sale:
      type: object
      additionalProperties: false
      required: [id, total_minor, currency, created_at, items]
      properties:
        id:
          type: string
          format: uuid
        total_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Total en centavos de COP
        currency:
          type: string
          enum: [COP]
        created_at:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [product_id, quantity, product_name, unit_price_minor, subtotal_minor]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
              product_name:
                type: string
              unit_price_minor:
                type: integer
                format: int64
              subtotal_minor:
                type: integer
                format: int64
    ProductInput:
      type: object
      additionalProperties: false
      required: [sku, name, price_minor, currency]
      properties:
        sku:
          type: string
          description: Se recortan espacios y convierte a mayúsculas; resultado de 1 a 64 caracteres A-Z, 0-9, punto, guion o guion bajo, comenzando por letra o número.
          example: CAFE-01
        name:
          type: string
          description: De 1 a 120 caracteres después de recortar espacios exteriores
          example: Café
        price_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Centavos de COP; debe enviarse como entero sin decimales
          example: 125050
        currency:
          type: string
          enum: [COP]
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, price_minor, currency, created_at]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9._-]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        price_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        currency:
          type: string
          enum: [COP]
        created_at:
          type: string
          format: date-time
    ProductError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_query, invalid_request, invalid_json, invalid_product, invalid_sale, idempotency_conflict, body_too_large, unsupported_media_type, sku_conflict, not_found, unauthorized, forbidden, unavailable]
    AuthError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [unauthorized, forbidden, unavailable]
    Healthy:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
